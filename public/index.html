<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Cuaca dan Musim Dunia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f3f6f5;--pn:#fff;--tx:#0d1b2a;--mu:#5d6d7c;--ac:#0f7c8a;--am:#e9961e;--bd:#dce4e2;color-scheme:light}
[data-theme=dark]{--bg:#0a1219;--pn:#111c26;--tx:#e6eef3;--mu:#8ba0b1;--ac:#37b6c6;--am:#f2a33a;--bd:#223240;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:grid;grid-template-columns:380px 1fr;height:100dvh;transition:grid-template-columns .25s}
.app.closed{grid-template-columns:0 1fr}
.app.closed aside{visibility:hidden}
aside{display:flex;flex-direction:column;background:var(--pn);border-right:1px solid var(--bd);min-height:0;min-width:0;overflow:hidden}
.hd{padding:18px 18px 12px}
h1{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.sub{margin:6px 0 4px;color:var(--mu);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tb{display:flex;gap:6px;flex:none}
.tb button{padding:6px 10px;min-width:38px}
.hd input,.hd select{display:block;width:100%;margin-top:8px;text-overflow:ellipsis}
#open{position:absolute;z-index:1000;top:14px;left:14px;display:none;background:var(--pn);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.app.closed #open{display:block}
#note{position:absolute;z-index:1000;left:50%;bottom:14px;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90%;text-align:center}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,li:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;border-top:1px solid var(--bd)}
li{display:grid;grid-template-columns:1fr auto;padding:10px 18px;border-bottom:1px solid var(--bd);cursor:pointer}
li:hover{background:var(--bg)}
li b{font-weight:600}
li span{grid-column:1;color:var(--mu);font-size:.8rem}
li time{grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums;font-weight:600}
#more{margin:10px 18px}
.ft{padding:10px 18px;border-top:1px solid var(--bd);color:var(--mu);font-size:.72rem}
#wrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
#detail{position:absolute;z-index:1000;top:14px;right:14px;width:350px;max-height:calc(100% - 28px);overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.x{float:right;padding:4px 10px}
#detail h2{margin:0;font-size:1.3rem;font-weight:800}
.muted{color:var(--mu)}
.now{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.tmp{font-size:3.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.ico{font-size:2.6rem}
.clk{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.15rem}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:600;font-size:.82rem;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid div{background:var(--bg);border-radius:10px;padding:8px 10px}
.grid small{display:block;color:var(--mu);font-size:.75rem}
h3{margin:16px 0 6px;font-size:.95rem}
.fc{display:grid;grid-template-columns:34px 26px 1fr 84px;gap:8px;align-items:center;padding:4px 0;font-size:.85rem}
.rg{position:relative;height:6px;border-radius:3px;background:var(--bd)}
.rg i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--am))}
[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
.leaflet-container{font-family:inherit}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:44dvh 1fr}.app.closed{grid-template-columns:1fr;grid-template-rows:1fr 0}#wrap{order:-1}aside{border-right:0}#detail{left:8px;right:8px;top:8px;width:auto;max-height:80%}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="hd">
<div class="top"><h1>Atlas Cuaca dan Musim</h1><div class="tb"><button id="bu" title="Ganti satuan suhu"></button><button id="bt" title="Ganti tema" aria-label="Ganti tema">🌓</button><button id="bp" title="Tutup panel" aria-label="Tutup panel">«</button></div></div>
<p class="sub" id="cnt">Memuat data kota…</p>
<input id="q" type="search" placeholder="Cari kota, mis. Jakarta" aria-label="Cari kota">
<select id="cc" aria-label="Negara"><option value="">Semua negara</option></select>
</div>
<ul id="list"></ul>
<button id="more" hidden>Muat lebih banyak</button>
<div class="ft">Kota: GeoNames (CC BY 4.0) · Cuaca dan kualitas udara: Open-Meteo · Peta: OpenStreetMap</div>
</aside>
<div id="wrap"><div id="map"></div><button id="open" aria-label="Buka panel">☰ Daftar kota</button><div id="note" hidden>Batas gratis Open-Meteo sedang tercapai. Titik abu-abu akan diwarnai otomatis sebentar lagi.</div><section id="detail" hidden aria-live="polite"></section></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
//#pure
const WC={0:["☀️","Cerah"],1:["🌤️","Cerah berawan"],2:["⛅","Berawan"],3:["☁️","Mendung"],45:["🌫️","Kabut"],48:["🌫️","Kabut"],51:["🌦️","Gerimis"],53:["🌦️","Gerimis"],55:["🌦️","Gerimis"],61:["🌧️","Hujan"],63:["🌧️","Hujan"],65:["🌧️","Hujan lebat"],71:["🌨️","Salju"],73:["🌨️","Salju"],75:["❄️","Salju lebat"],80:["🌦️","Hujan lokal"],81:["🌧️","Hujan lokal"],82:["🌧️","Hujan deras"],95:["⛈️","Badai petir"],96:["⛈️","Badai petir"],99:["⛈️","Badai petir"]};
const SN={semi:"🌸 Musim semi",panas:"☀️ Musim panas",gugur:"🍂 Musim gugur",dingin:"❄️ Musim dingin",tropis:"🌴 Wilayah tropis"};
const FM={};
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function lp(tz,d){d=d||new Date();const f=FM[tz]||(FM[tz]=new Intl.DateTimeFormat("en-GB",{timeZone:tz,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"})),p={};f.formatToParts(d).forEach(x=>{if(x.type!="literal")p[x.type]=+x.value});p.doy=Math.floor((Date.UTC(p.year,p.month-1,p.day)-Date.UTC(p.year,0,0))/864e5);p.off=Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(d.getTime()/1000)*1000)/6e4);return p}
function season(la,m){if(Math.abs(la)<=15)return"tropis";let i=[3,3,0,0,0,1,1,1,2,2,2,3][m-1];if(la<0)i=(i+2)%4;return["semi","panas","gugur","dingin"][i]}
function sunT(c,p){const r=Math.PI/180,B=2*Math.PI*(p.doy-81)/364,eq=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),dc=23.44*Math.sin(2*Math.PI*(284+p.doy)/365)*r,la=Math.max(-89.9,Math.min(89.9,c.la))*r,ch=(Math.sin(-.833*r)-Math.sin(la)*Math.sin(dc))/(Math.cos(la)*Math.cos(dc));if(ch>1)return{s:"pn"};if(ch<-1)return{s:"md"};const H=Math.acos(ch)/r/15,nn=12-c.lo/15-eq/60+p.off/60;return{s:"ok",rise:nn-H,set:nn+H,len:2*H}}
const hm=h=>{const m=Math.round(((h%24)+24)%24*60)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
//#endpure
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let C=[],res=[],shown=0,unit=localStorage.u||"C",map,layer,last=null,sel=null,tm,mt;
const T=c=>c==null?"—":unit=="F"?Math.round(c*9/5+32)+"°F":Math.round(c)+"°C";
const cn=new Intl.DisplayNames(["id"],{type:"region"}),country=cc=>{try{return cn.of(cc)}catch{return cc}};
const CK={},clock=tz=>(CK[tz]||(CK[tz]=new Intl.DateTimeFormat("id-ID",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}))).format(new Date()).replace(/\./g,":");
const pop=n=>n>=1e6?(n/1e6).toFixed(1)+" juta":n>=1e3?Math.round(n/1e3)+" ribu":n;
const col=t=>t==null?"#8a96a3":`hsl(${240-Math.max(0,Math.min(1,(t+10)/50))*240},85%,50%)`;
const aqi=v=>v==null?"—":v+" · "+(v<=50?"Baik":v<=100?"Sedang":v<=150?"Tidak sehat bagi kelompok sensitif":v<=200?"Tidak sehat":v<=300?"Sangat tidak sehat":"Berbahaya");
const MC=new Map();
async function om(u){const h=MC.get(u);if(h&&Date.now()-h.t<6e5)return h.d;const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();MC.set(u,{t:Date.now(),d});return d}
function tick(){document.querySelectorAll("time[data-tz]").forEach(e=>e.textContent=clock(e.dataset.tz))}
function search(){const q=norm($("#q").value.trim()),cc=$("#cc").value;res=C.filter(c=>(!cc||c.cc==cc)&&(!q||c.k.indexOf(q)==0||c.k.indexOf("|"+q)>=0));shown=0;$("#list").innerHTML="";more();if(!res.length)$("#list").innerHTML='<li class="muted">Tidak ada kota yang cocok.</li>'}
function more(){const rows=res.slice(shown,shown+40);shown+=rows.length;$("#list").insertAdjacentHTML("beforeend",rows.map(r=>`<li tabindex="0" data-id="${r.id}"><b>${esc(r.n)}</b><span>${esc(country(r.cc))} · ${pop(r.p)} penduduk</span><time data-tz="${esc(r.tz)}"></time></li>`).join(""));$("#more").hidden=shown>=res.length;tick()}
const TC=new Map();let seq=0,blocked=0,rt;
function draw(rows){layer.clearLayers();rows.forEach(r=>{const h=TC.get(r.id),t=h?h.t:null;
L.circleMarker([r.la,r.lo],{radius:6+Math.max(0,Math.min(6,Math.log10(r.p+1)-3)),color:"#fff",weight:1.5,fillColor:col(t),fillOpacity:.92}).addTo(layer).bindTooltip(`${r.n} · ${T(t)}`).on("click",()=>openCity(r.id))})}
function retry(){$("#note").hidden=false;clearTimeout(rt);rt=setTimeout(()=>refreshMap().catch(()=>{}),62000)}
async function refreshMap(){const tk=++seq,b=map.getBounds(),lim=map.getZoom()<4?60:80,w=Math.max(-180,b.getWest()),e=Math.min(180,b.getEast()),s=Math.max(-90,b.getSouth()),n=Math.min(90,b.getNorth()),rows=[];
for(let i=0;i<C.length&&rows.length<lim;i++){const c=C[i];if(c.la>=s&&c.la<=n&&c.lo>=w&&c.lo<=e)rows.push(c)}
draw(rows);const need=rows.filter(r=>{const h=TC.get(r.id);return !h||Date.now()-h.at>6e5});
if(!need.length)return;if(Date.now()<blocked){retry();return}
try{const r=await fetch("https://api.open-meteo.com/v1/forecast?current=temperature_2m&timezone=auto&latitude="+need.map(x=>x.la).join(",")+"&longitude="+need.map(x=>x.lo).join(","));
if(!r.ok)throw new Error(r.status);const d=await r.json(),a=Array.isArray(d)?d:[d];
need.forEach((x,i)=>{if(a[i]&&a[i].current)TC.set(x.id,{t:a[i].current.temperature_2m,at:Date.now()})});$("#note").hidden=true;if(tk==seq)draw(rows)}
catch(err){blocked=Date.now()+60000;retry()}}
async function openCity(id){sel=id;const c=C.find(x=>x.id==id),d=$("#detail");d.hidden=false;map.flyTo([c.la,c.lo],Math.max(map.getZoom(),6));render(c,null,null,true);
const p="latitude="+c.la+"&longitude="+c.lo+"&timezone=auto",r=await Promise.allSettled([om("https://api.open-meteo.com/v1/forecast?"+p+"&forecast_days=7&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,uv_index_max"),om("https://air-quality-api.open-meteo.com/v1/air-quality?"+p+"&current=us_aqi")]);
if(sel==id)render(c,r[0].value||null,r[1].value?r[1].value.current:null,false)}
function render(c,w,a,loading){last=[c,w,a];const p=lp(c.tz),s=sunT(c,p),n=w&&w.current,dl=w&&w.daily,o=WC[n&&n.weather_code]||["🌡️","—"],se=season(c.la,p.month);
const sun=s.s=="pn"?"Malam kutub":s.s=="md"?"Matahari tengah malam":`${hm(s.rise)} / ${hm(s.set)}`,day=s.s=="ok"?`${Math.floor(s.len)}j ${String(Math.round(s.len%1*60)%60).padStart(2,"0")}m`:s.s=="md"?"24j":"0j";
let fc="";if(dl){const lo=Math.min(...dl.temperature_2m_min),hi=Math.max(...dl.temperature_2m_max),sp=(hi-lo)||1;
fc=dl.time.map((t,i)=>`<div class="fc"><b>${new Date(t+"T00:00:00Z").toLocaleDateString("id-ID",{weekday:"short",timeZone:"UTC"})}</b><span>${(WC[dl.weather_code[i]]||["🌡️"])[0]}</span><div class="rg"><i style="left:${(dl.temperature_2m_min[i]-lo)/sp*100}%;width:${Math.max(4,(dl.temperature_2m_max[i]-dl.temperature_2m_min[i])/sp*100)}%"></i></div><span class="muted">${T(dl.temperature_2m_min[i])} / ${T(dl.temperature_2m_max[i])}</span></div>`).join("")}
$("#detail").innerHTML=`<button class="x" data-x>Tutup</button><h2>${esc(c.n)}</h2><div class="muted">${esc(country(c.cc))} · ${Math.abs(c.la).toFixed(2)}°${c.la<0?"S":"U"}, ${Math.abs(c.lo).toFixed(2)}°${c.lo<0?"B":"T"} · ${c.el} m dpl</div>
<div class="now"><div class="tmp">${n?T(n.temperature_2m):"—"}</div><div class="ico">${n&&!n.is_day&&n.weather_code<=2?"🌙":o[0]}</div><div><div>${n?o[1]:loading?"Memuat cuaca…":"Cuaca belum tersedia"}</div><div class="clk"><time data-tz="${esc(c.tz)}"></time></div></div></div>
<span class="badge">${SN[se]}</span>
<div class="grid"><div><small>Terasa seperti</small>${n?T(n.apparent_temperature):"—"}</div><div><small>Kelembapan</small>${n?n.relative_humidity_2m+"%":"—"}</div><div><small>Angin</small>${n?Math.round(n.wind_speed_10m)+" km/j":"—"}</div><div><small>Indeks UV maks</small>${dl?Math.round(dl.uv_index_max[0]):"—"}</div><div><small>Terbit / terbenam</small>${sun}</div><div><small>Lama siang</small>${day}</div><div style="grid-column:1/3"><small>Kualitas udara (US AQI)</small>${aqi(a&&a.us_aqi)}</div></div>
${se=="tropis"&&dl?`<p class="muted">Curah hujan 7 hari: ${dl.precipitation_sum.reduce((x,y)=>x+y,0).toFixed(0)} mm. Di daerah tropis, musim hujan dan kemarau mengikuti pola hujan lokal.</p>`:""}
<h3>Prakiraan 7 hari</h3>${fc||`<p class="muted">${loading?"Memuat prakiraan…":"Prakiraan belum tersedia."}</p>`}`;tick()}
$("#detail").onclick=e=>{if(e.target.closest("[data-x]")){sel=null;$("#detail").hidden=true}};
$("#list").onclick=e=>{const l=e.target.closest("li[data-id]");if(l)openCity(+l.dataset.id)};
$("#list").onkeydown=e=>{if(e.key=="Enter"){const l=e.target.closest("li[data-id]");if(l)openCity(+l.dataset.id)}};
$("#q").oninput=()=>{clearTimeout(tm);tm=setTimeout(search,200)};
$("#cc").onchange=search;$("#more").onclick=more;
const bu=()=>$("#bu").textContent="°"+unit;
$("#bu").onclick=()=>{unit=unit=="C"?"F":"C";localStorage.u=unit;bu();refreshMap();if(last)render(...last,false)};
function tiles(){if(!map._t)map._t=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map)}
$("#bt").onclick=()=>{const d=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=d;localStorage.th=d;tiles()};
document.documentElement.dataset.theme=localStorage.th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
map=L.map("map",{worldCopyJump:true,minZoom:2,zoomControl:false}).setView([20,10],2);L.control.zoom({position:"bottomright"}).addTo(map);layer=L.layerGroup().addTo(map);tiles();bu();
function panel(o){$(".app").classList.toggle("closed",!o);localStorage.pn=o?1:0;setTimeout(()=>map.invalidateSize(),300)}
$("#bp").onclick=()=>panel(false);$("#open").onclick=()=>panel(true);if(localStorage.pn=="0")panel(false);
map.on("moveend",()=>{clearTimeout(mt);mt=setTimeout(()=>refreshMap().catch(()=>{}),600)});
fetch("data/cities.json").then(r=>r.json()).then(d=>{
C=d.c.map(r=>({id:r[0],n:r[1],cc:r[2],la:r[3],lo:r[4],p:r[5],tz:d.tz[r[6]],el:r[7],k:norm(r[1])+"|"+norm(r[8]||"")}));
const cnt={};C.forEach(c=>cnt[c.cc]=(cnt[c.cc]||0)+1);const a=Object.keys(cnt).sort((x,y)=>country(x).localeCompare(country(y),"id"));
$("#cc").insertAdjacentHTML("beforeend",a.map(k=>`<option value="${k}">${esc(country(k))} (${cnt[k]})</option>`).join(""));
$("#cnt").textContent=`${C.length.toLocaleString("id-ID")} kota di ${a.length} negara · jam lokal, musim, cuaca, dan kualitas udara`;
search();refreshMap().catch(()=>{})}).catch(()=>{$("#cnt").textContent="Data kota gagal dimuat. Pastikan data/cities.json ada."});
setInterval(tick,1000);setInterval(()=>refreshMap().catch(()=>{}),6e5);
</script>
</body>
</html>
